qwen:
  model_name: "Qwen/Qwen3.5-2B"

# LoRA on Qwen's built-in visual encoder
# (shared between RGB and depth passes)
visual_lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules:        # adjust after inspecting Qwen visual encoder layers
    - "q_proj"
    - "v_proj"
    - "qkv"

# LoRA on Qwen LLM body (enabled at stage 3)
llm_lora:
  enabled_at_init: false   # set true to inject at __init__; otherwise stage 3 calls enable_llm_lora()
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"

max_regions: 32            # max <mask> tokens per sample
