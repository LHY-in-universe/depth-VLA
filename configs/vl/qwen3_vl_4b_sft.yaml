save_steps: 200
save_total_limit: 2
dataloader_num_workers: 4
lr_scheduler_type: cosine
torch_dtype: bfloat16
attn_implementation: flash_attention_2
gradient_checkpointing: true
bf16: true
tf32: true
report_to: none
depth_loss_weight: 0.1
depth_num_layers: 1
depth_num_heads: 4
depth_dim_head: 32
depth_ff_mult: 1
